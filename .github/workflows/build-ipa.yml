name: Build re-signable iPad IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for physical iPad without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project Flash4399.xcodeproj \
            -scheme Flash4399 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/Flash4399.app package/Payload/
          test -f package/Payload/Flash4399.app/Flash4399
          test -f package/Payload/Flash4399.app/WebAssets/Ruffle/ruffle_web_bg.QDRSAAAZ.wasm
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' package/Payload/Flash4399.app/Info.plist
          # Create a real signature slot and resource seal before third-party
          # re-signing. This local ad-hoc signature is NOT a device install identity.
          codesign --force --sign - --timestamp=none package/Payload/Flash4399.app
          codesign --verify --strict --verbose=2 package/Payload/Flash4399.app
          codesign --display --verbose=4 package/Payload/Flash4399.app 2>&1
          cd package
          zip -qry ../Flash4399-resignable.ipa Payload
          cd ..
          python3 scripts/validate-ipa.py Flash4399-resignable.ipa
          shasum -a 256 Flash4399-resignable.ipa > Flash4399-resignable.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Flash4399-resignable-ipa
          path: |
            Flash4399-resignable.ipa
            Flash4399-resignable.ipa.sha256
          retention-days: 30
          if-no-files-found: error
