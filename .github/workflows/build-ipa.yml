name: Build unsigned iPad IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for physical iPad without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project Flash4399.xcodeproj \
            -scheme Flash4399 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/Flash4399.app package/Payload/
          test -f package/Payload/Flash4399.app/Flash4399
          test -f package/Payload/Flash4399.app/Resources/Ruffle/ruffle_web_bg.QDRSAAAZ.wasm
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' package/Payload/Flash4399.app/Info.plist
          cd package
          zip -qry ../Flash4399-unsigned.ipa Payload
          cd ..
          shasum -a 256 Flash4399-unsigned.ipa > Flash4399-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Flash4399-unsigned-ipa
          path: |
            Flash4399-unsigned.ipa
            Flash4399-unsigned.ipa.sha256
          retention-days: 30
          if-no-files-found: error
